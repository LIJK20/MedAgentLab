# /etc/nginx/sites-available/medagentlab
#
# MedAgentLab — production Nginx config for the Vite static build.
# Designed for: Ubuntu 22.04+ · Nginx 1.18+ · static `dist/` output.
#
# Install:
#   sudo cp deploy/nginx-medagentlab.conf /etc/nginx/sites-available/medagentlab
#   sudo ln -s /etc/nginx/sites-available/medagentlab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen      80;
    listen      [::]:80;

    # Replace with your domain or public IP.
    server_name medagentlab.example.com _;

    root        /var/www/medagentlab;
    index       index.html;

    # ---- Logging --------------------------------------------------
    access_log  /var/log/nginx/medagentlab.access.log;
    error_log   /var/log/nginx/medagentlab.error.log warn;

    # ---- Gzip / Brotli --------------------------------------------
    gzip                on;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Security headers ----------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ---- Static asset cache (Vite emits hashed filenames) --------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires           1y;
        add_header        Cache-Control "public, immutable";
        access_log        off;
        try_files         $uri =404;
    }

    # ---- SPA fallback --------------------------------------------
    # All non-asset routes resolve to index.html — required so
    # in-page anchors like /#contact still work after a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- Hide dotfiles -------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    client_max_body_size 4m;
}

# -----------------------------------------------------------------
# After you point a real domain at this server, harden with HTTPS:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d medagentlab.example.com
#
# Certbot will edit this file in place to add the listen 443 ssl
# block and auto-renewal via systemd timer.
# -----------------------------------------------------------------
